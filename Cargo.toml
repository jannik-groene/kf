[package]
name = "kf"
version = "0.0.7"
authors = ["jgroene <jannik.groene@gmail.com>"]
edition = "2018"

[lib]
name = "kf_internals"
bench = true

[profile.release]
debug = 0

[profile.test]
opt-level = 3

[dependencies]
bitintr = { version = "0.3.0" }
rand = "*"
rayon = "*"

[dev-dependencies]
criterion = "0.3"
criterion-cycles-per-byte = "0.1.2"

[[bench]]
name = "move_gen_bench"
harness = false
