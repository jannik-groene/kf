[package]
name = "kf"
version = "0.0.7"
authors = ["jgroene <jannik.groene@gmail.com>"]
edition = "2021"

[lib]
name = "kf_internals"
bench = true

[profile.release]
debug = true
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 3

[dependencies]
bitintr = { version = "0.3.0" }
rand = "*"
arrayvec = { version = "0.7.2" }
lazy_static = "1.4.0"

[dev-dependencies]
criterion = "0.3"
criterion-cycles-per-byte = "0.1.2"

[[bench]]
name = "move_gen_bench"
harness = false
